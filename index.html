<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger & Life — personal tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F4F1;--card:#fff;--ink:#17231F;--mute:#5E6E68;--line:#D9E0DB;--teal:#0F6B5B;--red:#C43D2E;--amber:#C98514;--slate:#6B7C8F;--r:10px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--ink);color:#fff}
header h1{font-size:1.3rem}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:#B9C7C1;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--teal);color:#fff}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6FC7B5;outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}
.pri{background:var(--teal);color:#fff;border:0;padding:9px 16px;border-radius:8px}.ghost{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{display:block;font:700 1.7rem 'Bricolage Grotesque'}.stat span{color:var(--mute);font-size:.9rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:5px solid var(--slate)}
.col.urgent{border-top-color:var(--red)}.col.mid{border-top-color:var(--amber)}.col h2{font-size:1.1rem;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row small{display:block;color:var(--mute)}.row.overdue small{color:var(--red);font-weight:600}
.tag{font-size:.75rem;padding:1px 8px;border-radius:99px;background:#E4ECE8;color:var(--teal);margin-left:6px}
.tag.inv{background:#F3E6C8;color:#7A5209}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:.85rem}.mini.x{color:var(--red)}
.empty{color:var(--mute);padding:8px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-weight:600;color:var(--mute);text-align:center;font-size:.85rem}
.day{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden;text-align:left}
.day.dim{opacity:.4}.day.today{border:2px solid var(--teal)}.day em{font-style:normal;font-weight:600;font-size:.85rem}
.chip{display:block;font-size:.72rem;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--slate)}
.chip.urgent{background:var(--red)}.chip.mid{background:var(--amber)}.chip.inv{background:var(--teal)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:.9rem}
.meter{height:10px;background:#E4ECE8;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--teal)}
input[type=range]{width:100%}
dialog{border:0;border-radius:14px;padding:22px;width:min(440px,94vw)}dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0;font-weight:600;font-size:.9rem}
dialog input,dialog select,dialog textarea{width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);border-radius:8px;font:inherit}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.acts button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff}.acts .pri{background:var(--teal);color:#fff;border:0}
#gate{max-width:520px;margin:12vh auto;padding:24px;text-align:center}
@media(max-width:640px){.day{min-height:60px}.chip{display:none}.day.has::after{content:"•";color:var(--teal)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="gate"><h1>Ledger &amp; Life</h1><p class="empty">Invoices, tasks, goals and reflection in one place.</p><div id="gmsg"></div></div>
<div id="app" hidden>
<header><h1>Ledger &amp; Life</h1><nav id="nav"></nav><button class="ghost" onclick="app.out()">Sign out</button></header>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script type="module">
/* ============ 1. PASTE YOUR FIREBASE CONFIG HERE ============ */
const firebaseConfig={apiKey:"AIzaSyBrwiXRSt21Yu8_hj3lpj6-Yr83thXwoM8",authDomain:"wallace-n-nduta.firebaseapp.com",projectId:"wallace-n-nduta",storageBucket:"wallace-n-nduta.firebasestorage.app",messagingSenderId:"958456699637",appId:"1:958456699637:web:8af1490ca44aacf67d83bc"};
const CURRENCY="USD";      // e.g. "KES", "EUR", "GBP"
const BILL_AHEAD_DAYS=14;  // invoices are generated this many days before they are due
/* ============================================================ */
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:CURRENCY}).format(+n||0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const diff=s=>Math.round((parse(s)-parse(TODAY))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const STEP={Monthly:1,Quarterly:3,Annually:12};
const when=s=>{const n=diff(s);return n<0?`${-n}d overdue`:n==0?'Due today':n==1?'Due tomorrow':`In ${n} days · ${s}`};

let db,uid,view='Dashboard',calMonth=new Date(),unsubs=[];
const S={clients:[],invoices:[],tasks:[],goals:[],wins:[],reviews:[]},ready={};
const COLS=Object.keys(S);
const ref=c=>collection(db,'users',uid,c),dref=(c,id)=>doc(db,'users',uid,c,id);
const add=(c,d)=>addDoc(ref(c),d),upd=(c,id,d)=>updateDoc(dref(c,id),d),del=(c,id)=>deleteDoc(dref(c,id));

/* ---------- auth ---------- */
if(firebaseConfig.apiKey==="YOUR_API_KEY"){$('#gmsg').innerHTML='<p><b>Setup needed:</b> paste your Firebase config at the top of index.html (see README steps).</p>'}
else{
 const fb=initializeApp(firebaseConfig),auth=getAuth(fb);db=getFirestore(fb);
 const fs='padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;width:100%';
 $('#gmsg').innerHTML=`<div style="display:grid;gap:10px;margin-top:8px;text-align:left">
  <input id="em" type="email" placeholder="Email" autocomplete="username" style="${fs}">
  <input id="pw" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password" style="${fs}">
  <button class="pri" id="si">Sign in</button>
  <button class="ghost" id="su">Create account</button>
  <button class="ghost" id="fp" style="border:0">Forgot password?</button>
  <button class="ghost" id="gg">Continue with Google</button>
  <p id="err" role="alert" style="color:var(--red);margin:0"></p></div>`;
 const em=()=>$('#em').value.trim(),pw=()=>$('#pw').value;
 const fail=e=>{$('#err').style.color='var(--red)';$('#err').textContent=({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'Enter a valid email address.','auth/email-already-in-use':'That email already has an account. Use Sign in.','auth/weak-password':'Use a password of at least 6 characters.','auth/missing-password':'Enter your password.','auth/operation-not-allowed':'Email sign-in is not enabled in Firebase yet.'})[e.code]||e.message};
 $('#si').onclick=()=>signInWithEmailAndPassword(auth,em(),pw()).catch(fail);
 $('#su').onclick=()=>createUserWithEmailAndPassword(auth,em(),pw()).catch(fail);
 $('#fp').onclick=()=>sendPasswordResetEmail(auth,em()).then(()=>{$('#err').style.color='var(--teal)';$('#err').textContent='Password reset email sent. Check your inbox.'}).catch(fail);
 $('#gg').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
 $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#si').click()};
 window.app={out:()=>signOut(auth)};
 onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];
  if(!u){$('#gate').hidden=false;$('#app').hidden=true;return}
  uid=u.uid;$('#gate').hidden=true;$('#app').hidden=false;
  COLS.forEach(c=>unsubs.push(onSnapshot(ref(c),snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));ready[c]=1;autoBill();render()})));
 });
}

/* ---------- recurring invoice automation ---------- */
let billing=false;
async function autoBill(){
 if(billing||!ready.clients||!ready.invoices)return;billing=true;
 for(const c of S.clients){
  if(c.active===false||!c.nextDue)continue;let d=c.nextDue,changed=false;
  while(diff(d)<=BILL_AHEAD_DAYS){
   const id=`${c.id}_${d}`;
   if(!S.invoices.some(i=>i.id===id))await setDoc(dref('invoices',id),{clientId:c.id,clientName:c.name,amount:+c.amount,due:d,status:'pending',frequency:c.frequency});
   d=addMonths(d,STEP[c.frequency]||1);changed=true;
  }
  if(changed)await upd('clients',c.id,{nextDue:d});
 }
 billing=false;
}

/* ---------- urgency engine ---------- */
function items(){
 const t=S.tasks.filter(x=>!x.done).map(x=>({kind:'task',id:x.id,title:x.title,due:x.due,cat:x.category,p:x.priority,remind:+x.remind||1}));
 const i=S.invoices.filter(x=>x.status!=='paid').map(x=>({kind:'invoice',id:x.id,title:`${x.clientName} · ${money(x.amount)}`,due:x.due,p:'Mid',remind:3,sent:x.status==='sent'}));
 return[...t,...i].map(x=>{const n=diff(x.due);x.days=n;
  x.lvl=n<0||x.p==='Urgent'||(x.kind==='invoice'&&n<=3)||n<=1?'urgent':(x.p==='Mid'||n<=7||(x.kind==='invoice'&&n<=10))?'mid':'low';return x}).sort((a,b)=>a.days-b.days);
}
const rowHtml=x=>`<div class="row ${x.days<0?'overdue':''}"><div><b>${esc(x.title)}</b><span class="tag ${x.kind=='invoice'?'inv':''}">${x.kind=='invoice'?(x.sent?'invoice · sent':'invoice'):esc(x.cat||'task')}</span><small>${when(x.due)}</small></div>
 <div>${x.kind=='invoice'?`${x.sent?'':`<button class="mini" onclick="app.sent('${x.id}')">Sent</button> `}<button class="mini" onclick="app.paid('${x.id}')">Paid</button>`:`<button class="mini" onclick="app.done('${x.id}')">Done</button>`}</div></div>`;

/* ---------- views ---------- */
const VIEWS=['Dashboard','Calendar','Invoices','Tasks','Goals','Reflect'];
function render(){
 if(!uid)return;
 $('#nav').innerHTML=VIEWS.map(v=>`<button class="${v==view?'on':''}" onclick="app.go('${v}')">${v}</button>`).join('');
 $('#main').innerHTML=({Dashboard,Calendar,Invoices,Tasks,Goals,Reflect})[view]();
}
function Dashboard(){
 const all=items(),by=l=>all.filter(x=>x.lvl===l),list=a=>a.length?a.map(rowHtml).join(''):'<div class="empty">Nothing here. Nice.</div>';
 const out=S.invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+ +i.amount,0),over=all.filter(x=>x.days<0).length;
 const wk=addDays(TODAY,-7),doneWk=S.tasks.filter(t=>t.done&&t.doneOn>=wk).length;
 const gp=S.goals.length?Math.round(S.goals.reduce((s,g)=>s+ +g.progress,0)/S.goals.length):0;
 const inc=S.invoices.filter(i=>i.status==='paid'&&(i.paidOn||'').slice(0,7)===TODAY.slice(0,7)).reduce((s,i)=>s+ +i.amount,0);
 return`<div class="bar"><div><h2>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2></div>
  <div><button class="ghost" onclick="app.notify()">Enable reminders</button> <button class="pri" onclick="app.task()">Add task</button></div></div>
 <div class="stats"><div class="stat"><b>${money(out)}</b><span>Outstanding invoices</span></div><div class="stat"><b>${money(inc)}</b><span>Collected this month</span></div>
 <div class="stat"><b>${over}</b><span>Overdue items</span></div><div class="stat"><b>${doneWk}</b><span>Tasks done, last 7 days</span></div><div class="stat"><b>${gp}%</b><span>Average goal progress</span></div></div>
 <div class="cols"><div class="col urgent"><h2>Urgent</h2>${list(by('urgent'))}</div><div class="col mid"><h2>Mid-level</h2>${list(by('mid'))}</div><div class="col"><h2>Coming up</h2>${list(by('low').slice(0,10))}</div></div>
 <div class="panel" style="margin-top:16px"><h2>Recent wins</h2>${S.wins.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(w=>`<div class="row"><div><b>${esc(w.title)}</b><span class="tag">${esc(w.area)}</span></div><small>${w.date}</small></div>`).join('')||'<div class="empty">Log an accomplishment in the Goals tab.</div>'}</div>`;
}
function Calendar(){
 const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),all=items();
 const doneT=S.tasks.filter(t=>t.done).map(t=>({title:t.title,due:t.due,lvl:'low',kind:'task'}));
 let cells='';
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d),ev=[...all,...doneT].filter(x=>x.due===s);
  cells+=`<button class="day ${d.getMonth()!=m?'dim':''} ${s==TODAY?'today':''} ${ev.length?'has':''}" onclick="app.task('${s}')"><em>${d.getDate()}</em>${ev.map(x=>`<span class="chip ${x.kind=='invoice'?'inv':x.lvl}">${esc(x.title)}</span>`).join('')}</button>`}
 return`<div class="bar"><div><button class="ghost" onclick="app.mo(-1)">Prev</button> <button class="ghost" onclick="app.mo(1)">Next</button></div><h2>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><span class="empty">Click a day to add a task</span></div>
 <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div>`;
}
function Invoices(){
 const inv=S.invoices.slice().sort((a,b)=>a.due.localeCompare(b.due)).reverse();
 return`<div class="bar"><h2>Clients &amp; recurring billing</h2><button class="pri" onclick="app.client()">Add client</button></div>
 <div class="panel"><table><tr><th>Client</th><th>Amount</th><th>Repeats</th><th>Next invoice</th><th></th></tr>${S.clients.map(c=>`<tr><td>${esc(c.name)}<small style="display:block;color:var(--mute)">${esc(c.email||'')}</small></td><td>${money(c.amount)}</td><td>${c.frequency}</td><td>${c.nextDue}</td><td><button class="mini" onclick="app.client('${c.id}')">Edit</button> <button class="mini x" onclick="app.rm('clients','${c.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 class="empty">Add a client and invoices are created automatically before each due date.</td></tr>'}</table></div>
 <h2 style="margin-bottom:8px">Invoices</h2><div class="panel"><table><tr><th>Client</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr>${inv.map(i=>`<tr><td>${esc(i.clientName)}</td><td>${money(i.amount)}</td><td>${i.due}</td><td>${i.status==='pending'&&diff(i.due)<0?'overdue':i.status}</td><td>${i.status!=='paid'?`<button class="mini" onclick="app.paid('${i.id}')">Mark paid</button>`:''} <button class="mini x" onclick="app.rm('invoices','${i.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 class="empty">No invoices yet.</td></tr>'}</table></div>`;
}
function Tasks(){
 const open=items().filter(x=>x.kind==='task'),done=S.tasks.filter(t=>t.done);
 return`<div class="bar"><h2>Tasks</h2><button class="pri" onclick="app.task()">Add task</button></div>
 <div class="panel"><h3>Open</h3>${open.map(rowHtml).join('')||'<div class="empty">No open tasks.</div>'}</div>
 <div class="panel"><h3>Completed</h3>${done.map(t=>`<div class="row"><div>${esc(t.title)}<small>Finished ${t.doneOn||''}</small></div><button class="mini x" onclick="app.rm('tasks','${t.id}')">Delete</button></div>`).join('')||'<div class="empty">Nothing completed yet.</div>'}</div>`;
}
function Goals(){
 return`<div class="bar"><h2>Goals &amp; accomplishments</h2><div><button class="ghost" onclick="app.win()">Log accomplishment</button> <button class="pri" onclick="app.goal()">Add goal</button></div></div>
 <div class="cols">${['Work','Personal'].map(a=>`<div class="col"><h2>${a} goals</h2>${S.goals.filter(g=>g.area===a).map(g=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>${esc(g.title)}</b><span>${g.progress}%</span></div>
 <div class="meter"><i style="width:${g.progress}%"></i></div><input type="range" min="0" max="100" step="5" value="${g.progress}" aria-label="Progress for ${esc(g.title)}" onchange="app.prog('${g.id}',this.value)">
 <small>${g.target?`Target ${g.target} · ${when(g.target)}`:'No target date'} <button class="mini x" onclick="app.rm('goals','${g.id}')">Delete</button></small></div>`).join('')||'<div class="empty">No goals yet.</div>'}</div>`).join('')}</div>
 <div class="panel" style="margin-top:16px"><h2>Accomplishments</h2>${S.wins.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="row"><div><b>${esc(w.title)}</b><span class="tag">${esc(w.area)}</span></div><div><small>${w.date}</small><button class="mini x" onclick="app.rm('wins','${w.id}')">Delete</button></div></div>`).join('')||'<div class="empty">Record wins big and small.</div>'}</div>`;
}
const AREAS=['Work','Finances','Health','Relationships','Growth'];
function Reflect(){
 const rv=S.reviews.slice().sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="bar"><h2>Self-assessment</h2><button class="pri" onclick="app.review()">New check-in</button></div>
 ${rv.map(r=>`<div class="panel"><div class="bar" style="margin:0"><h3>${r.date}</h3><button class="mini x" onclick="app.rm('reviews','${r.id}')">Delete</button></div>
 ${AREAS.map(a=>`<div style="display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center"><span>${a}</span><div class="meter"><i style="width:${(r[a]||0)*20}%"></i></div><b>${r[a]||0}</b></div>`).join('')}
 <p>${esc(r.notes)}</p></div>`).join('')||'<div class="empty">Rate each area of your life from 1 to 5 and note what to change next week.</div>'}`;
}

/* ---------- forms ---------- */
function form(title,fields,save){
 const d=$('#dlg');
 d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="3"></textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.r?'required':''} ${f.t=='number'?'step="any"':''}>`}</label>`).join('')}<div class="acts"><button value="x" formnovalidate>Cancel</button><button value="ok" class="pri">Save</button></div></form>`;
 d.onclose=()=>{if(d.returnValue=='ok')save(Object.fromEntries(new FormData(d.querySelector('form'))));d.returnValue=''};
 d.showModal();
}
window.app=Object.assign(window.app||{},{
 go:v=>{view=v;render()},mo:n=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);render()},
 task:(d)=>form('New task',[{k:'title',l:'What needs doing?',r:1},{k:'due',l:'Due date',t:'date',v:d||TODAY,r:1},{k:'priority',l:'Priority',o:['Urgent','Mid','Low'],v:'Mid'},{k:'category',l:'Area',o:['Work','Personal']},{k:'remind',l:'Remind me this many days before',t:'number',v:1}],x=>add('tasks',{...x,remind:+x.remind,done:false})),
 client:(id)=>{const c=S.clients.find(z=>z.id===id)||{};form(id?'Edit client':'New client',[{k:'name',l:'Client name',v:c.name,r:1},{k:'email',l:'Email',t:'email',v:c.email},{k:'amount',l:'Amount per invoice',t:'number',v:c.amount,r:1},{k:'frequency',l:'Billing cycle',o:['Monthly','Quarterly','Annually'],v:c.frequency},{k:'nextDue',l:'First / next due date',t:'date',v:c.nextDue||TODAY,r:1}],x=>id?upd('clients',id,{...x,amount:+x.amount}):add('clients',{...x,amount:+x.amount,active:true}))},
 goal:()=>form('New goal',[{k:'title',l:'Goal',r:1},{k:'area',l:'Area',o:['Work','Personal']},{k:'target',l:'Target date',t:'date'}],x=>add('goals',{...x,progress:0})),
 win:()=>form('Log accomplishment',[{k:'title',l:'What did you achieve?',r:1},{k:'area',l:'Area',o:['Work','Personal']},{k:'date',l:'Date',t:'date',v:TODAY}],x=>add('wins',x)),
 review:()=>form('Weekly check-in (1 = poor, 5 = great)',[{k:'date',l:'Date',t:'date',v:TODAY},...AREAS.map(a=>({k:a,l:a,t:'number',v:3})),{k:'notes',l:'What went well? What will you change?',t:'area'}],x=>{AREAS.forEach(a=>x[a]=Math.min(5,Math.max(1,+x[a]||3)));add('reviews',x)}),
 done:id=>upd('tasks',id,{done:true,doneOn:TODAY}),sent:id=>upd('invoices',id,{status:'sent'}),paid:id=>upd('invoices',id,{status:'paid',paidOn:TODAY}),
 prog:(id,v)=>upd('goals',id,{progress:+v}),rm:(c,id)=>confirm('Delete this permanently?')&&del(c,id),
 notify:async()=>{if(!('Notification'in window))return alert('Notifications are not supported in this browser.');if(await Notification.requestPermission()=='granted')remind(true)}
});
/* Reminders fire when the app is open. For alerts while closed, add Cloud Functions + FCM (see README). */
function remind(force){
 if(!('Notification'in window)||Notification.permission!=='granted')return;
 const k='reminded-'+TODAY;if(localStorage.getItem(k)&&!force)return;
 const due=items().filter(x=>x.days<=x.remind);
 if(due.length){new Notification(`${due.length} item${due.length>1?'s':''} need attention`,{body:due.slice(0,4).map(x=>x.title).join('\n')});localStorage.setItem(k,1)}
}
setTimeout(()=>{if(ready.tasks&&ready.invoices)remind()},2500);
</script>
