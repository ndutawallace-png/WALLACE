.nbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--red);color:#fff;font:700 .7rem Figtree;line-height:18px;text-align:center}
.notif-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.notif-item:last-child{border:0}
.notif-dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}.notif-dot.urgent{background:var(--red)}.notif-dot.mid{background:var(--amber)}.notif-dot.info{background:var(--teal)}
.notif-body{flex:1;min-width:0}.notif-body b{display:block;overflow-wrap:anywhere}.notif-body small{color:var(--mute);display:block;margin-top:2px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#1E4F9A,#0F2A52);color:#F2B84B;display:inline-flex;align-items:center;justify-content:center;font:700 .85rem 'Bricolage Grotesque',serif;flex:none;border:2px solid #2A70D0;cursor:pointer}
.avatar.lg{width:112px;height:112px;font-size:2.4rem;border-width:3px}.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.prof-card{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.prof-meta b{font:700 1.4rem 'Bricolage Grotesque'}.prof-meta .role{color:var(--teal);font-weight:600}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.prof-field{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}.prof-field small{display:block;color:var(--mute);font-size:.8rem;margin-bottom:2px}.prof-field span{font-weight:600;overflow-wrap:anywhere}
@media(max-width:560px){.prof-card{grid-template-columns:1fr;justify-items:center;text-align:center}}
[data-theme=light] .newswire{background:#F4F6F9;color:#141A22}
@media print{.newswire,#ticker{display:none!important}}


.searchbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:18}
.searchbar input{flex:1;min-width:0;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.searchwrap{position:relative;flex:1;min-width:0}
.searchwrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55;font-size:.9rem;pointer-events:none}
#searchHits{position:absolute;left:16px;right:16px;top:100%;max-height:min(60vh,420px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0006;z-index:30;display:none}
#searchHits.on{display:block}
#searchHits .hit{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);font:inherit}
#searchHits .hit:hover{background:color-mix(in srgb,var(--teal) 12%,transparent)}
#searchHits .hit b{display:block}#searchHits .hit small{color:var(--mute)}
#searchHits .hit .tag{margin-left:0}
main.filtering .row,main.filtering tr{display:none}
main.filtering .row.match,main.filtering tr.match{display:flex}
main.filtering table tr.match{display:table-row}
main.filtering .panel.empty-hide{opacity:.35}
@media print{.searchbar,#searchHits{display:none!important}}

.lhp,.lhf{display:none}@media print{.lhp{display:block;margin-bottom:10px}.lhp img{height:64px}.lhp .tg{font:700 8pt Arial;letter-spacing:.08em;margin-top:2px}.lhf{display:block;position:fixed;bottom:0;left:0;right:0;border-top:2px solid #DA2525;padding-top:4px;font:8pt Arial;text-align:center}}.why{cursor:pointer;text-decoration:underline dotted}.stat.click,.kc.click,.clickh{cursor:pointer}.stat.click:hover{border-color:var(--teal)}</style>

/* ---------- recurring invoice automation ---------- */
let billing=false;
async function autoBill(){
 if(billing||!ready.clients||!ready.invoices)return;billing=true;
 for(const c of S.clients){
  if(c.active===false||!c.nextDue)continue;let d=c.nextDue,changed=false;
  while(diff(d)<=BILL_AHEAD_DAYS){
   const id=`${c.id}_${d}`;
   if(!S.invoices.some(i=>i.id===id))await setDoc(dref('invoices',id),{clientId:c.id,clientName:c.name,amount:(+c.amount||0),due:d,status:'pending',frequency:c.frequency});
   d=addMonths(d,STEP[c.frequency]||1);changed=true;
  }
  if(changed)await upd('clients',c.id,{nextDue:d});
 }
 billing=false;
}

 return[...t,...i,...bl,...py].map(x=>{const n=diff(x.due);x.days=n;
  x.lvl=n<0||x.p==='Urgent'||(x.kind!=='task'&&n<=3)||n<=1?'urgent':(x.p==='Mid'||n<=7||(x.kind!=='task'&&n<=10))?'mid':'low';return x}).sort((a,b)=>a.days-b.days||(a.time||'99').localeCompare(b.time||'99'));
}

function runGlobalSearch(q){
 const box=$('#searchHits'),inp=$('#qsearch');if(!box)return;
 _sq=(q||'').trim().toLowerCase();
 const main=$('#main');
 if(!_sq){box.classList.remove('on');box.innerHTML='';if(main)main.classList.remove('filtering');main&&main.querySelectorAll('.match').forEach(e=>e.classList.remove('match'));return}
 // Filter visible rows in current tab
 if(main){
  main.classList.add('filtering');
  main.querySelectorAll('.row, tr').forEach(el=>{
   const t=(el.textContent||'').toLowerCase();
   el.classList.toggle('match', t.includes(_sq));
  });
 }
 const hits=searchIndex().filter(h=>(h.title+' '+h.detail+' '+h.tab).toLowerCase().includes(_sq)).slice(0,40);
 if(!hits.length){box.innerHTML='<div class="empty" style="padding:14px">No matches for “'+esc(_sq)+'”</div>';box.classList.add('on');return}
 box.innerHTML=hits.map((h,i)=>`<button type="button" class="hit" data-i="${i}" role="option"><div><b>${esc(h.title)}</b><small>${esc(h.detail)}</small></div><span class="tag">${esc(h.tab)}</span></button>`).join('');
 box.classList.add('on');
 box.querySelectorAll('.hit').forEach((btn,i)=>{
  btn.onclick=()=>{const h=hits[i];box.classList.remove('on');if(inp)inp.value='';_sq='';
   if(main)main.classList.remove('filtering');
   if(h.go)app.go(h.go);
  };
 });
}
function wireSearch(){

 document.addEventListener('click',e=>{if(box&&!box.contains(e.target)&&e.target!==inp)box.classList.remove('on')});
}

let reconAcc='';
function reconDiff(a){
 const book=accBal(a),stmt=+a.stmt||0;
 const items=S.recon.filter(r=>r.accId===a.id&&r.status!=='cleared');
 const unpres=items.filter(r=>r.side==='book'),uncred=items.filter(r=>r.side==='bank');
 const adjBook=book+unpres.filter(r=>r.effect==='add').reduce((t,r)=>t+(+r.amount||0),0)-unpres.filter(r=>r.effect==='less').reduce((t,r)=>t+(+r.amount||0),0);
 const adjStmt=stmt+uncred.filter(r=>r.effect==='add').reduce((t,r)=>t+(+r.amount||0),0)-uncred.filter(r=>r.effect==='less').reduce((t,r)=>t+(+r.amount||0),0);
 const red='#F0645A',green='#3BA776';
 return{book,stmt,adjBook,adjStmt,diff:Math.round((adjBook-adjStmt)*100)/100,open:items.length,stmtDate:a.stmtDate||'',monthOk:(a.stmtDate||'').slice(0,7)===THIS,reconOk:a.reconMonth===THIS,red,green};
}
function Recon(){

 if(!a)return`<div class="bar"><h2>Bank reconciliation</h2></div><div class="panel empty">Add a bank or M-Pesa account under Budget first.</div>`;
 const R=reconDiff(a);
 const items=S.recon.filter(r=>r.accId===a.id&&r.status!=='cleared');
 const unpres=items.filter(r=>r.side==='book'),uncred=items.filter(r=>r.side==='bank');

 return`<div class="bar"><h2>Bank reconciliation</h2><div>

 <div class="stat"><b>${money(R.stmt)}</b><span>Balance per statement</span></div>

}

 photo:()=>{
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{
   const f=i.files&&i.files[0];if(!f)return;
   try{
    let bmp;try{bmp=await createImageBitmap(f)}catch(e){
     const url=URL.createObjectURL(f);const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
     bmp=img;URL.revokeObjectURL(url);
    }
    const max=512,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    let data=c.toDataURL('image/jpeg',0.82);
    if(data.length>750000)data=c.toDataURL('image/jpeg',0.65);
    if(data.length>900000)return alert('Photo is still too large after compression. Try a smaller image.');
    const p=profile();
    await setDoc(dref('settings','profile'),{...p,photo:data});
   }catch(e){alert('Could not upload photo: '+(e.message||e))}
  };
  i.click();
 },

 ],x=>add('txns',{type:'expense',daily:false,variable:true,amount:+x.amount,category:x.category,note:x.note,date:x.date,acc:accId(x.acc)})),

 cfpay:id=>{const r=S.recurring.find(z=>z.id===id);if(!r)return;form('Pay from account: '+r.name,[
  {k:'amount',l:'Amount',t:'number',v:r.amount,r:1},{k:'date',l:'Payment date',t:'date',v:TODAY,r:1},
  {k:'acc',l:'Pay from account',o:accOpts()}
 ],x=>{if(!x.acc||x.acc==='No account')return alert('Choose the account that pays this');
  add('txns',{type:'expense',amount:+x.amount,category:r.category,date:x.date,note:r.name,recId:r.id,acc:accId(x.acc)});
 })},
 cfearn:id=>{const r=S.recurring.find(z=>z.id===id);if(!r)return;form('Mark earned: '+r.name,[
  {k:'amount',l:'Amount received',t:'number',v:r.amount,r:1},{k:'date',l:'Date received',t:'date',v:TODAY,r:1},
  {k:'acc',l:'Received into account',o:accOpts()},{k:'how',l:'How was it earned / paid?',v:r.name}
 ],x=>{if(!x.acc||x.acc==='No account')return alert('Choose the account money landed in');
  add('txns',{type:'income',amount:+x.amount,category:r.category,date:x.date,note:x.how||r.name,recId:r.id,acc:accId(x.acc)});
 })},
 earn:()=>form('Log money in (goes to Cashflow)',[
  {k:'amount',l:'Amount received',t:'number',r:1},{k:'note',l:'What is this income?',r:1},
  {k:'category',l:'Category',o:INC},{k:'acc',l:'Received into account',o:accOpts()},
  {k:'how',l:'How was it earned?',v:''},{k:'date',l:'Date',t:'date',v:TODAY,r:1}
 ],x=>{if(!x.acc||x.acc==='No account')return alert('Choose account');
  add('txns',{type:'income',amount:+x.amount,category:x.category,date:x.date,note:(x.how?x.how+' · ':'')+x.note,acc:accId(x.acc)});
 }),
 seedmsh:()=>{if(S.accounts.some(a=>/m-?shwari/i.test(a.name||'')))return alert('M-Shwari already exists');add('accounts',{name:'M-Shwari',kind:'M-Pesa',number:'',opening:0,asOf:TODAY})},
 contribmsh:()=>{const msh=S.accounts.find(a=>/m-?shwari/i.test(a.name||''));if(!msh)return alert('Add M-Shwari first');
  form('Deposit to M-Shwari',[
   {k:'amount',l:'Amount',t:'number',r:1},{k:'from',l:'From account',o:accOpts()},
   {k:'date',l:'Date',t:'date',v:TODAY,r:1},{k:'note',l:'Note',v:'To M-Shwari savings'}
  ],x=>{
   if(x.from&&x.from!=='No account'&&accId(x.from)!==msh.id)add('txns',{type:'transfer',amount:+x.amount,date:x.date,acc:accId(x.from),to:msh.id,note:x.note});
   else add('txns',{type:'income',amount:+x.amount,category:'Savings',date:x.date,note:x.note,acc:msh.id});
  })},
 planedit:id=>{const p=S.plans.find(z=>z.id===id);if(!p)return;form('Edit savings plan',[
  {k:'name',l:'What are you saving for?',v:p.name,r:1},{k:'target',l:'Target amount',t:'number',v:p.target,r:1},
  {k:'saved',l:'Already saved',t:'number',v:p.saved},{k:'deadline',l:'Want it by',t:'date',v:p.deadline,r:1}
 ],x=>upd('plans',id,{name:x.name,target:+x.target,saved:+x.saved,deadline:x.deadline}))},
 allocate:()=>{const o=bstat(curM()),used=o.rows.reduce((t,r)=>t+r.spent,0)+o.un.reduce((t,x)=>t+x[1],0),free=o.inc-used;
  form('Allocate budget free to an account',[
   {k:'amount',l:'Amount from budget free (available ~ '+money(Math.max(0,free))+')',t:'number',v:Math.max(0,Math.round(free)),r:1},
   {k:'acc',l:'Into account',o:accOpts()},
   {k:'note',l:'Note',v:'Allocated from budget free'},
   {k:'date',l:'Date',t:'date',v:TODAY,r:1}
  ],x=>{
   if(!x.acc||x.acc==='No account')return alert('Choose an account');
   add('txns',{type:'expense',category:'Savings',amount:+x.amount,date:x.date,note:x.note||'Allocated from budget free',acc:accId(x.acc),allocate:true});
  })},
 reconitem:()=>{const a=S.accounts.find(x=>x.id===reconAcc)||S.accounts[0];if(!a)return alert('Add account first');
  form('Reconciling item · '+a.name,[
   {k:'date',l:'Date',t:'date',v:TODAY,r:1},{k:'desc',l:'Description',r:1},
   {k:'side',l:'Side',o:['Outstanding on books (not on statement yet)','On statement only (not yet in books)']},
   {k:'effect',l:'Effect',o:['Add','Less']},{k:'amount',l:'Amount',t:'number',r:1}
  ],x=>add('recon',{accId:a.id,date:x.date,desc:x.desc,side:x.side.startsWith('Outstanding')?'book':'bank',effect:x.effect==='Add'?'add':'less',amount:+x.amount,status:'open'}))},
 reclear:id=>upd('recon',id,{status:'cleared'}),
 reconmark:id=>{const a=S.accounts.find(z=>z.id===id);if(!a)return;const R=reconDiff(a);
  if(Math.abs(R.diff)>=0.5&&!confirm('Difference is still '+money(R.diff)+'. Mark reconciled anyway?'))return;
  upd('accounts',id,{reconMonth:THIS,reconOn:TODAY})}
});
/* Reminders fire when the app is open. For alerts while closed, add Cloud Functions + FCM (see README). */
function remind(force){
 const due=items().filter(x=>x.days<=x.remind);
 if(!due.length)return;
 const k='reminded-'+TODAY+'-'+due.map(x=>x.id).sort().join(',').slice(0,80);
 if(localStorage.getItem(k)&&!force)return;
 if('Notification'in window&&Notification.permission==='granted'){
  new Notification(due.length+' item'+(due.length>1?'s':'')+' need attention',{body:due.slice(0,6).map(x=>(x.days<0?'OVERDUE':x.days==0?'Today':'In '+x.days+'d')+': '+x.title).join('\n')});
 }
 const c=waCfg();
 if(c.on&&c.phone&&c.apikey){const msg='*Winn* '+due.length+' item(s):\n'+due.slice(0,8).map(x=>'• '+(x.days<0?'OVERDUE':x.days===0?'Today':('In '+x.days+'d'))+': '+x.title).join('\n');sendWhatsApp(msg)}
 localStorage.setItem(k,1)}
setInterval(()=>ready.tasks&&remind(),15*60*1000);
setTimeout(()=>{if(ready.tasks&&ready.invoices)remind()},2500);
setInterval(()=>{if(uid&&typeof updateTicker==='function')try{updateTicker()}catch(e){}},30000);
setTimeout(()=>{if(typeof updateTicker==='function')try{updateTicker(true)}catch(e){}},800);
</script>
