<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger & Life — personal tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--paper:#12151A;--card:#1C2129;--ink:#E4E9F0;--mute:#8C97A7;--line:#2C333E;--teal:#2A70D0;--blue:#7DB2FF;--red:#F0645A;--amber:#E0A030;--slate:#5F7088;--r:10px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:#0B0E12;color:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:1.3rem}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:#9AA7B8;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--teal);color:#fff}
button{font:inherit;cursor:pointer;color:var(--ink)}input,select,textarea{background:var(--paper);color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6FC7B5;outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}
.pri{background:var(--teal);color:#fff !important;border:0;padding:9px 16px;border-radius:8px}.ghost{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{display:block;font:700 1.7rem 'Bricolage Grotesque'}.stat span{color:var(--mute);font-size:.9rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:5px solid var(--slate)}
.col.urgent{border-top-color:var(--red)}.col.mid{border-top-color:var(--amber)}.col h2{font-size:1.1rem;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row small{display:block;color:var(--mute)}.row.overdue small{color:var(--red);font-weight:600}
.tag{font-size:.75rem;padding:1px 8px;border-radius:99px;background:#22324D;color:var(--blue);margin-left:6px}
.tag.inv{background:#3A2F17;color:#E7B85A}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 9px;font-size:.85rem}.mini.x{color:var(--red)}
.empty{color:var(--mute);padding:8px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-weight:600;color:var(--mute);text-align:center;font-size:.85rem}
.day{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden;text-align:left}
.day.dim{opacity:.4}.day.today{border:2px solid var(--teal)}.day em{font-style:normal;font-weight:600;font-size:.85rem}
.chip{display:block;font-size:.72rem;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--slate)}
.chip.urgent{background:var(--red)}.chip.mid{background:var(--amber)}.chip.inv{background:var(--teal)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:.9rem}
.meter{height:10px;background:#2A313B;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--teal)}
input[type=range]{width:100%;accent-color:var(--teal)}
dialog{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:22px;width:min(440px,94vw)}dialog::backdrop{background:#000A}
dialog label{display:block;margin:10px 0;font-weight:600;font-size:.9rem}
dialog input,dialog select,dialog textarea{width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);border-radius:8px;font:inherit}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.acts button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}.acts .pri{background:var(--teal);color:#fff !important;border:0}
#gate{max-width:520px;margin:12vh auto;padding:24px;text-align:center}
@media(max-width:640px){.day{min-height:60px}.chip{display:none}.day.has::after{content:"•";color:var(--teal)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.mc{aspect-ratio:1;min-height:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;padding:0}.mc b{font-size:.7rem}.mc.dim{opacity:.35}.mc.b1{background:#1F3A63}.mc.b2{background:#2A70D0;color:#fff}.mc.od{background:var(--red);color:#fff}.mc.today{outline:2px solid #fff}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mute);font-size:.85rem;margin-top:8px}.lg{width:12px;height:12px;border-radius:3px;background:var(--paper);border:1px solid var(--line)}.lg.b1{background:#1F3A63}.lg.b2{background:#2A70D0}.lg.od{background:var(--red)}
.brow{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:8px;align-items:center;margin:8px 0}.vc{display:flex;gap:12px;height:170px}.vg{flex:1;display:flex;flex-direction:column}.vb{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}.vb i{width:40%;max-width:36px;min-height:2px;border-radius:4px 4px 0 0}.vg small{text-align:center;color:var(--mute)}
@media print{header,.bar button,nav{display:none}body{background:#fff}}
.clocks{display:grid;grid-template-columns:minmax(300px,1fr) 2fr;gap:14px;margin-bottom:20px}.hero{display:flex;gap:16px;align-items:center;padding:16px;border-radius:20px;border:1px solid #2B4A7A;background:linear-gradient(150deg,#14366A,#0A101C);box-shadow:0 10px 30px #0006}.hero svg{width:42%;min-width:110px;filter:drop-shadow(0 0 12px #2A70D080)}.hero small{color:#8FB4EA;letter-spacing:.12em}.hero .dt{display:block;font:700 2.3rem 'Bricolage Grotesque';font-variant-numeric:tabular-nums}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.city{border-radius:16px;padding:12px;border:1px solid #2B3D5E;display:flex;flex-direction:column;gap:5px}.city .dt{font:700 1.6rem 'Bricolage Grotesque';font-variant-numeric:tabular-nums}.city[data-sky=dawn]{background:linear-gradient(160deg,#2C2C56,#7A4A48)}.city[data-sky=day]{background:linear-gradient(160deg,#1B4E8C,#2A78BE)}.city[data-sky=dusk]{background:linear-gradient(160deg,#39294F,#A5503A)}.city[data-sky=night]{background:linear-gradient(160deg,#080B14,#151E38)}
.nm{font-weight:600;color:#fff}.nm em{display:block;font-style:normal;color:#B9CBE6;font-size:.8rem;font-weight:400}.dd{color:#B9C7DB;font-size:.85rem}.dp{height:6px;border-radius:9px;background:#0007;overflow:hidden}.dp i{display:block;height:100%;background:linear-gradient(90deg,#F0B54A,#7DB2FF)}.pill{font-size:.72rem;padding:2px 9px;border-radius:99px;background:#0008;width:fit-content;color:#DCE7F7}
.tk{stroke:#5F82B8;stroke-width:1}.tk.big{stroke:#DCE7F7;stroke-width:2}.hh,.mh{stroke:#fff;stroke-width:4;stroke-linecap:round}.mh{stroke-width:2.6}.sh{stroke:#F0645A;stroke-width:1.2}.pin{fill:#F0645A}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.kc{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--slate);border-radius:12px;padding:12px}.kc.neglected{border-left-color:var(--red)}.kc.watch{border-left-color:var(--amber)}.kc.ok{border-left-color:#3BA776}.kh{display:flex;justify-content:space-between}.ks{font:700 2rem 'Bricolage Grotesque'}.kc small{display:block;color:var(--mute);margin-top:8px}.dotd{width:10px;height:10px;border-radius:3px;background:var(--line)}.dotd.on{background:#3BA776}
@media(max-width:820px){.clocks{grid-template-columns:1fr}}
</style>
</head>

<main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script type="module">

const CURRENCY="KES";      // e.g. "KES", "EUR", "GBP"

/* ============================================================ */

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:CURRENCY,maximumFractionDigits:0}).format(+n||0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const diff=s=>Math.round((parse(s)-parse(TODAY))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const STEP={Monthly:1,Quarterly:3,Annually:12};
const when=s=>{const n=diff(s);return n<0?`${-n}d overdue`:n==0?'Due today':n==1?'Due tomorrow':`In ${n} days · ${s}`};

let db,uid,view='Dashboard',calMonth=new Date(),unsubs=[];
const S={clients:[],invoices:[],tasks:[],goals:[],wins:[],reviews:[],txns:[],budgets:[],recurring:[],plans:[],billing:[],daily:[]},ready={};
const COLS=Object.keys(S);
const ref=c=>collection(db,'users',uid,c),dref=(c,id)=>doc(db,'users',uid,c,id);
const add=(c,d)=>addDoc(ref(c),d),upd=(c,id,d)=>updateDoc(dref(c,id),d),del=(c,id)=>deleteDoc(dref(c,id));

/* ---------- auth ---------- */
if(firebaseConfig.apiKey==="YOUR_API_KEY"){$('#gmsg').innerHTML='<p><b>Setup needed:</b> paste your Firebase config at the top of index.html (see README steps).</p>'}
else{
 const fb=initializeApp(firebaseConfig),auth=getAuth(fb);db=getFirestore(fb);
 const fs='padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;width:100%';
 $('#gmsg').innerHTML=`<div style="display:grid;gap:10px;margin-top:8px;text-align:left">
  <input id="em" type="email" placeholder="Email" autocomplete="username" style="${fs}">
  <input id="pw" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password" style="${fs}">
  <button class="pri" id="si">Sign in</button>
  <button class="ghost" id="su">Create account</button>
  <button class="ghost" id="fp" style="border:0">Forgot password?</button>
  <button class="ghost" id="gg">Continue with Google</button>
  <p id="err" role="alert" style="color:var(--red);margin:0"></p></div>`;
 const em=()=>$('#em').value.trim(),pw=()=>$('#pw').value;
 const fail=e=>{$('#err').style.color='var(--red)';$('#err').textContent=({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'Enter a valid email address.','auth/email-already-in-use':'That email already has an account. Use Sign in.','auth/weak-password':'Use a password of at least 6 characters.','auth/missing-password':'Enter your password.','auth/operation-not-allowed':'Email sign-in is not enabled in Firebase yet.'})[e.code]||e.message};
 $('#si').onclick=()=>signInWithEmailAndPassword(auth,em(),pw()).catch(fail);
 $('#su').onclick=()=>createUserWithEmailAndPassword(auth,em(),pw()).catch(fail);
 $('#fp').onclick=()=>sendPasswordResetEmail(auth,em()).then(()=>{$('#err').style.color='var(--teal)';$('#err').textContent='Password reset email sent. Check your inbox.'}).catch(fail);
 $('#gg').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
 $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#si').click()};
 window.app={out:()=>signOut(auth)};
 onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];
  if(!u){$('#gate').hidden=false;$('#app').hidden=true;return}
  uid=u.uid;$('#gate').hidden=true;$('#app').hidden=false;
  COLS.forEach(c=>unsubs.push(onSnapshot(ref(c),snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));ready[c]=1;autoBill();render()})));
 });
}

/* ---------- recurring invoice automation ---------- */
let billing=false;
async function autoBill(){
 if(billing||!ready.clients||!ready.invoices)return;billing=true;
 for(const c of S.clients){
  if(c.active===false||!c.nextDue)continue;let d=c.nextDue,changed=false;
  while(diff(d)<=BILL_AHEAD_DAYS){
   const id=`${c.id}_${d}`;
   if(!S.invoices.some(i=>i.id===id))await setDoc(dref('invoices',id),{clientId:c.id,clientName:c.name,amount:(+c.amount||0),due:d,status:'pending',frequency:c.frequency});
   d=addMonths(d,STEP[c.frequency]||1);changed=true;
  }
  if(changed)await upd('clients',c.id,{nextDue:d});
 }
 billing=false;
}

/* ---------- urgency engine ---------- */
function items(){
 const t=S.tasks.filter(x=>!x.done).map(x=>({kind:'task',id:x.id,title:x.title,due:x.due,cat:x.client||x.category,p:x.priority,remind:+x.remind||1}));
 const i=S.invoices.filter(x=>x.status!=='paid').map(x=>({kind:'invoice',id:x.id,title:`${x.clientName} invoice`,due:x.due,p:'Mid',remind:3,sent:x.status==='sent'}));
 const bl=S.billing.filter(b=>b.lastInvoiced).map(b=>({kind:'bill',id:b.id,title:`${b.name} · for ${b.owner}`,due:billNext(b),p:'Mid',remind:2}));return[...t,...i,...bl].map(x=>{const n=diff(x.due);x.days=n;
  x.lvl=n<0||x.p==='Urgent'||(x.kind!=='task'&&n<=3)||n<=1?'urgent':(x.p==='Mid'||n<=7||(x.kind!=='task'&&n<=10))?'mid':'low';return x}).sort((a,b)=>a.days-b.days);
}
const rowHtml=x=>`<div class="row ${x.days<0?'overdue':''}"><div><b>${esc(x.title)}</b><span class="tag ${x.kind!='task'?'inv':''}">${x.kind=='bill'?'invoice date':x.kind=='invoice'?(x.sent?'invoice · sent':'invoice'):esc(x.cat||'task')}</span><small>${when(x.due)}</small></div>
 <div>${x.kind=='bill'?`<button class="mini" onclick="app.billed('${x.id}')">Invoiced</button>`:x.kind=='invoice'?`${x.sent?'':`<button class="mini" onclick="app.sent('${x.id}')">Sent</button> `}<button class="mini" onclick="app.paid('${x.id}')">Paid</button>`:`<button class="mini" onclick="app.done('${x.id}')">Done</button>`}</div></div>`;

/* ---------- views ---------- */

/* ---------- world clocks ---------- */
const ZONES=[['Nairobi','Kenya','Africa/Nairobi'],['London','UK','Europe/London'],['Shanghai','China','Asia/Shanghai'],['New York','USA','America/New_York'],['Tokyo','Japan','Asia/Tokyo']];
const zt=z=>{const p={};new Intl.DateTimeFormat('en-GB',{timeZone:z,hour:'numeric',minute:'numeric',second:'numeric',hour12:false,weekday:'short',day:'numeric',month:'short',timeZoneName:'longOffset'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p};
const offH=t=>{const m=/GMT([+-])(\d\d):?(\d\d)?/.exec(t||'');return m?(m[1]=='-'?-1:1)*(+m[2]+(+m[3]||0)/60):0};
function Clocks(){return`<div class="clocks"><div class="hero" id="ck0" data-sky="day"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="fg"><stop offset="0" stop-color="#1E3357"/><stop offset="1" stop-color="#0A0F18"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#fg)" stroke="#3C6CB8" stroke-width="2.5"/>${[...Array(60)].map((_,k)=>`<line x1="60" y1="8" x2="60" y2="${k%5?11:16}" transform="rotate(${k*6} 60 60)" class="tk${k%5?'':' big'}"/>`).join('')}<line class="hh" x1="60" y1="60" x2="60" y2="34"/><line class="mh" x1="60" y1="60" x2="60" y2="19"/><line class="sh" x1="60" y1="69" x2="60" y2="13"/><circle cx="60" cy="60" r="3.5" class="pin"/></svg><div><small>HOME · KENYA</small><b class="dt"></b><span class="dd"></span><div class="dp"><i></i></div><span class="pill"></span></div></div>
<div class="cities">${ZONES.slice(1).map(([c,n],i)=>`<div class="city" id="ck${i+1}" data-sky="day"><span class="nm">${c}<em>${n}</em></span><b class="dt"></b><small class="dd"></small><div class="dp"><i></i></div><span class="pill"></span></div>`).join('')}</div></div>`}
function tick(){const hm=zt(ZONES[0][2]);ZONES.forEach(([c,n,z],i)=>{const el=document.getElementById('ck'+i);if(!el)return;const p=zt(z),h=+p.hour%24,m=+p.minute,sc=+p.second,d=offH(p.timeZoneName)-offH(hm.timeZoneName),pad=v=>String(v).padStart(2,'0'),open=!['Sat','Sun'].includes(p.weekday)&&h>=9&&h<17;
 el.dataset.sky=h>=5&&h<8?'dawn':h>=8&&h<17?'day':h>=17&&h<20?'dusk':'night';
 if(i==0){const r=(q,a)=>el.querySelector(q).setAttribute('transform',`rotate(${a} 60 60)`);r('.hh',(h%12)*30+m/2);r('.mh',m*6+sc/10);r('.sh',sc*6)}
 el.querySelector('.dt').textContent=i?`${pad(h)}:${pad(m)}`:`${pad(h)}:${pad(m)}:${pad(sc)}`;el.querySelector('.dd').textContent=`${p.weekday} ${p.day} ${p.month}`;
 el.querySelector('.dp i').style.width=((h*3600+m*60+sc)/864)+'%';
 el.querySelector('.pill').textContent=(open?'Open for business':'Closed')+(i?` · ${d==0?'same time':Math.abs(d)+'h '+(d<0?'behind':'ahead')}`:` · ${el.dataset.sky}`)})}
setInterval(tick,1000);
/* ---------- daily tasks & client performance ---------- */
const TYPES=['Invoicing','Paying bills','Bookkeeping','Reconciliation','Tax & compliance','Reporting','Admin','Other'],OWN=()=>['Personal',...S.clients.map(c=>c.name)];
const dk=d=>'d'+d.replace(/-/g,''),lastN=n=>[...Array(n)].map((_,i)=>addDays(TODAY,-i)),isOn=(d,x)=>!!(d.log&&d.log[dk(x)]);
function kpi(o){
 const T=S.tasks.filter(t=>(t.client||'Other')===o),done=T.filter(t=>t.done),D=S.daily.filter(d=>d.client===o),B=S.billing.filter(b=>b.owner===o&&b.lastInvoiced);
 const tr=pct(done.length,T.length),ot=pct(done.filter(t=>t.doneOn<=t.due).length,done.length),od=T.filter(t=>!t.done&&diff(t.due)<0).length;
 const dr=pct(D.reduce((t,d)=>t+lastN(7).filter(x=>isOn(d,x)).length,0),D.length*7),bn=B.map(billNext).sort(),bod=bn.filter(x=>diff(x)<0).length;
 const acts=[...done.map(t=>t.doneOn||''),...D.flatMap(d=>Object.keys(d.log||{}).filter(k=>d.log[k]).map(k=>k.slice(1,5)+'-'+k.slice(5,7)+'-'+k.slice(7)))].filter(Boolean).sort(),last=acts[acts.length-1],gap=last?-diff(last):null;
 const parts=[T.length?tr:null,D.length?dr:null].filter(x=>x!==null),score=parts.length?Math.round(parts.reduce((a,b)=>a+b)/parts.length):null;
 const st=T.length+D.length+B.length===0?'empty':(od+bod>0||(T.length+D.length>0&&(gap===null||gap>=3)))?'neglected':score!==null&&score<60?'watch':'ok';

 <p>${save>=gap?`Cutting and trimming as shown frees about ${money(save)} a month, enough to close the gap.`:`Cutting and trimming frees about ${money(save)}, still ${money(gap-save)} short. Postpone the plans above or raise income.`}</p></div>`:''}
 <div class="cols"><div class="panel"><h2>Where your money goes</h2>${rows.map(r=>bar(r[0],r[1],exp,lim[r[0]]&&r[1]>lim[r[0]]?'var(--red)':'var(--teal)',money(r[1])+(lim[r[0]]?' / '+money(lim[r[0]]):''))).join('')||'<div class="empty">No spending yet.</div>'}</div>
 <div class="panel"><h2>Recurring every month</h2>${li(S.recurring,r=>`<div class="row"><div><b>${esc(r.name)}</b><span class="tag">${esc(r.category)}</span></div><div><b style="color:${r.type==='income'?'#3BA776':'var(--red)'}">${r.type==='income'?'+':'-'}${money(r.amount)}</b> <button class="mini x" onclick="app.rm('recurring','${r.id}')">Delete</button></div></div>`)}<small class="empty">Recurring items count every month automatically. Log only one-off and day-to-day spending as entries.</small></div></div>
 <div class="panel"><h2>Income vs spending, last 6 months</h2>${cols(ch,['var(--teal)','var(--red)'])}<div class="legend"><i class="lg b2"></i>Income <i class="lg od"></i>Spending</div></div>
 <div class="panel"><h2>Variable entries this month</h2>${li(a.sort((x,y)=>y.date.localeCompare(x.date)),t=>`<div class="row"><div><b>${esc(t.category)}</b> ${esc(t.note||'')}<small>${t.date}</small></div><div><b style="color:${t.type==='income'?'#3BA776':'var(--red)'}">${t.type==='income'?'+':'-'}${money(t.amount)}</b> <button class="mini x" onclick="app.rm('txns','${t.id}')">Delete</button></div></div>`)}</div>`;
}
function Report(){
 const dueM=S.tasks.filter(t=>(t.due||'').slice(0,7)===THIS),doneM=S.tasks.filter(t=>t.done&&(t.doneOn||'').slice(0,7)===THIS);
 const cRate=pct(dueM.filter(t=>t.done).length,dueM.length),ot=pct(doneM.filter(t=>t.doneOn<=t.due).length,doneM.length);
 const im=S.invoices.filter(i=>i.due.slice(0,7)===THIS),acted=im.filter(i=>lateDays(i)!==null),iot=pct(acted.filter(i=>lateDays(i)<=0).length,im.length);
 const late=acted.filter(i=>lateDays(i)>0),avgLate=late.length?Math.round(late.reduce((s,i)=>s+lateDays(i),0)/late.length):0;
 const back=items().filter(x=>x.days<0).length,ahead=items().filter(x=>x.days>=0&&x.days<=30).length,inc=mTot(THIS,'income'),sr=inc?pct(inc-mTot(THIS,'expense'),inc):0;
 const gp=S.goals.length?Math.round(S.goals.reduce((t,g)=>t+ +g.progress,0)/S.goals.length):0;
 const score=Math.round((cRate+ot+(im.length?iot:100))/3),grade=score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'E';
 const wk=[1,2,3,4,5].map(n=>({l:'Wk '+n,v:[doneM.filter(t=>Math.ceil(+t.doneOn.slice(8)/7)===n).length]}));
 const K=(b,l)=>`<div class="stat"><b>${b}</b><span>${l}</span></div>`;
 return`<div class="bar"><h2>${new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})} report</h2><button class="ghost" onclick="print()">Print or save PDF</button></div>
 <div class="stats">${K(grade+' · '+score+'%','Month score')}${K(cRate+'%','Task completion rate')}${K(ot+'%','Tasks finished on time')}${K(im.length?iot+'%':'n/a','Invoices actioned by due date')}${K(avgLate+' days','Average lateness on late invoices')}${K(back,'Overdue backlog')}${K(ahead,'Deadlines in next 30 days')}${K(S.clients.length,'Active clients')}${K(sr+'%','Savings rate')}${K(gp+'%','Goal progress')}</div>
 ${RepKpi()}<div class="cols"><div class="panel"><h2>Tasks completed per week</h2>${cols(wk,['var(--teal)'])}</div><div class="panel"><h2>Work done by client</h2>${clientBars()}</div></div>
 <div class="panel"><h2>Accomplished this month (${doneM.length})</h2>${doneM.sort((x,y)=>y.doneOn.localeCompare(x.doneOn)).map(t=>`<div class="row"><div><b>${esc(t.title)}</b><span class="tag">${esc(t.client||t.category)}</span></div><small>${t.doneOn}</small></div>`).join('')||'<div class="empty">Finish a task and it appears here.</div>'}${S.wins.filter(w=>w.date.slice(0,7)===THIS).map(w=>`<div class="row"><div><b>${esc(w.title)}</b><span class="tag">win</span></div><small>${w.date}</small></div>`).join('')}</div>`;
}
const AREAS=['Work','Finances','Health','Relationships','Growth'];
function Reflect(){
 const rv=S.reviews.slice().sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="bar"><h2>Self-assessment</h2><button class="pri" onclick="app.review()">New check-in</button></div>
 ${rv.map(r=>`<div class="panel"><div class="bar" style="margin:0"><h3>${r.date}</h3><button class="mini x" onclick="app.rm('reviews','${r.id}')">Delete</button></div>
 ${AREAS.map(a=>`<div style="display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center"><span>${a}</span><div class="meter"><i style="width:${(r[a]||0)*20}%"></i></div><b>${r[a]||0}</b></div>`).join('')}
 <p>${esc(r.notes)}</p></div>`).join('')||'<div class="empty">Rate each area of your life from 1 to 5 and note what to change next week.</div>'}`;
}

/* ---------- forms ---------- */
function form(title,fields,save){
 const d=$('#dlg');
 d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="3"></textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.r?'required':''} ${f.t=='number'?'step="any"':''}>`}</label>`).join('')}<div class="acts"><button value="x" formnovalidate>Cancel</button><button value="ok" class="pri">Save</button></div></form>`;
 d.onclose=()=>{if(d.returnValue=='ok')save(Object.fromEntries(new FormData(d.querySelector('form'))));d.returnValue=''};
 d.showModal();
}
window.app=Object.assign(window.app||{},{
 go:v=>{view=v;render()},mo:n=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);render()},
 task:(d)=>form('New task',[{k:'title',l:'What needs doing?',r:1},{k:'client',l:'Whose task is this?',o:OWN()},{k:'type',l:'Type of work',o:TYPES},{k:'due',l:'Due date',t:'date',v:d||TODAY,r:1},{k:'priority',l:'Priority',o:['Urgent','Mid','Low'],v:'Mid'},{k:'remind',l:'Remind me this many days before',t:'number',v:1}],x=>add('tasks',{...x,category:x.client==='Personal'?'Personal':'Work',remind:+x.remind,done:false})),
 client:(id)=>{const c=S.clients.find(z=>z.id===id)||{};form(id?'Edit client':'New client',[{k:'name',l:'Client name',v:c.name,r:1},{k:'email',l:'Email',t:'email',v:c.email},{k:'frequency',l:'Billing cycle',o:['Monthly','Quarterly','Annually'],v:c.frequency},{k:'nextDue',l:'First / next invoice date',t:'date',v:c.nextDue||TODAY,r:1}],x=>id?upd('clients',id,x):add('clients',{...x,amount:0,active:true}))},
 goal:()=>form('New goal',[{k:'title',l:'Goal',r:1},{k:'area',l:'Area',o:['Work','Personal']},{k:'target',l:'Target date',t:'date'}],x=>add('goals',{...x,progress:0})),
 win:()=>form('Log accomplishment',[{k:'title',l:'What did you achieve?',r:1},{k:'area',l:'Area',o:['Work','Personal']},{k:'date',l:'Date',t:'date',v:TODAY}],x=>add('wins',x)),
 review:()=>form('Weekly check-in (1 = poor, 5 = great)',[{k:'date',l:'Date',t:'date',v:TODAY},...AREAS.map(a=>({k:a,l:a,t:'number',v:3})),{k:'notes',l:'What went well? What will you change?',t:'area'}],x=>{AREAS.forEach(a=>x[a]=Math.min(5,Math.max(1,+x[a]||3)));add('reviews',x)}),
 done:id=>upd('tasks',id,{done:true,doneOn:TODAY}),sent:id=>upd('invoices',id,{status:'sent',sentOn:TODAY}),paid:id=>upd('invoices',id,{status:'paid',paidOn:TODAY}),
 bill:(id)=>{const b=S.billing.find(z=>z.id===id)||{};form(id?'Edit client':'Add client I invoice',[{k:'name',l:'Client name',v:b.name,r:1},{k:'owner',l:'Whose client is this?',o:S.clients.length?S.clients.map(c=>c.name):['Twocan'],v:b.owner},{k:'cycle',l:'Invoice cycle',o:['Monthly','Quarterly','Annually'],v:b.cycle},{k:'lastInvoiced',l:'Last invoice date',t:'date',v:b.lastInvoiced||TODAY,r:1}],x=>id?upd('billing',id,x):add('billing',x))},
 billed:id=>{const b=S.billing.find(z=>z.id===id);form('Invoiced: '+b.name,[{k:'date',l:'Invoice date (keep the due date to stay on schedule)',t:'date',v:billNext(b)||TODAY,r:1}],x=>upd('billing',id,{lastInvoiced:x.date}))},
 daily:()=>form('New daily task',[{k:'name',l:'What do you do every day?',r:1},{k:'client',l:'Whose task is this?',o:OWN()},{k:'type',l:'Type of work',o:TYPES}],x=>add('daily',{...x,log:{}})),
 tickd:(id,v)=>upd('daily',id,{['log.'+dk(TODAY)]:v}),
 addc:()=>form('Add client',[{k:'name',l:'Client name',r:1}],x=>add('clients',{name:x.name.trim(),frequency:'Monthly',nextDue:'',amount:0,active:true})),
 seed:()=>['Twocan','LTV','Sarah'].filter(n=>!S.clients.some(c=>c.name.toLowerCase()===n.toLowerCase())).forEach(n=>add('clients',{name:n,frequency:'Monthly',nextDue:'',amount:0,active:true})),
 rec:()=>form('Recurring monthly item',[{k:'name',l:'Name (Rent, Salary, Netflix...)',r:1},{k:'type',l:'Type',o:['Expense','Income']},{k:'amount',l:'Monthly amount',t:'number',r:1},{k:'category',l:'Category',o:[...EXP,...INC]}],x=>add('recurring',{...x,type:x.type.toLowerCase(),amount:+x.amount,from:THIS})),
 plan:()=>form('New savings plan',[{k:'name',l:'What are you saving for?',r:1},{k:'target',l:'Target amount',t:'number',r:1},{k:'saved',l:'Already saved',t:'number',v:0},{k:'deadline',l:'Want it by',t:'date',r:1}],x=>add('plans',{...x,target:+x.target,saved:+x.saved})),
 contrib:id=>{const p=S.plans.find(z=>z.id===id);form('Add to '+p.name,[{k:'amount',l:'Amount saved now',t:'number',r:1}],x=>upd('plans',id,{saved:+p.saved + +x.amount}))},
 txn:()=>form('Add income or expense',[{k:'type',l:'Type',o:['Expense','Income']},{k:'amount',l:'Amount',t:'number',r:1},{k:'category',l:'Category (income: '+INC.join(', ')+')',o:[...EXP,...INC]},{k:'date',l:'Date',t:'date',v:TODAY},{k:'note',l:'Note (optional)'}],x=>add('txns',{...x,amount:+x.amount,type:x.type.toLowerCase()})),
 limit:()=>form('Monthly limit for a category',[{k:'category',l:'Category',o:EXP},{k:'limit',l:'Monthly limit',t:'number',r:1}],x=>setDoc(dref('budgets',x.category),{category:x.category,limit:+x.limit})),
 prog:(id,v)=>upd('goals',id,{progress:+v}),rm:(c,id)=>confirm('Delete this permanently?')&&del(c,id),
 notify:async()=>{if(!('Notification'in window))return alert('Notifications are not supported in this browser.');if(await Notification.requestPermission()=='granted')remind(true)}
});
/* Reminders fire when the app is open. For alerts while closed, add Cloud Functions + FCM (see README). */
function remind(force){
 if(!('Notification'in window)||Notification.permission!=='granted')return;
 const due=items().filter(x=>x.days<=x.remind),k='reminded-'+TODAY+'-'+due.length;
 if(!due.length||(localStorage.getItem(k)&&!force))return;
 new Notification(`${due.length} item${due.length>1?'s':''} need attention`,{body:due.slice(0,6).map(x=>`${x.days<0?'OVERDUE':x.days==0?'Today':'In '+x.days+'d'}: ${x.title}`).join('\n')});localStorage.setItem(k,1)}
setInterval(()=>ready.tasks&&remind(),15*60*1000);
setTimeout(()=>{if(ready.tasks&&ready.invoices)remind()},2500);
</script>
