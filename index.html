const firebaseConfig={apiKey:"AIzaSyBrwiXRSt21Yu8_hj3lpj6-Yr83thXwoM8",authDomain:"wallace-n-nduta.firebaseapp.com",projectId:"wallace-n-nduta",storageBucket:"wallace-n-nduta.firebasestorage.app",messagingSenderId:"958456699637",appId:"1:958456699637:web:8af1490ca44aacf67d83bc"};

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const diff=s=>Math.round((parse(s)-parse(TODAY))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const STEP={Monthly:1,Quarterly:3,Annually:12};

window.toggleTheme=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme||'dark');

  <p id="err" role="alert" style="color:var(--red);margin:0"></p></div>`;
 const em=()=>$('#em').value.trim(),pw=()=>$('#pw').value;
 const fail=e=>{$('#err').style.color='var(--red)';$('#err').textContent=({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'Enter a valid email address.','auth/email-already-in-use':'That email already has an account. Use Sign in.','auth/weak-password':'Use a password of at least 6 characters.','auth/missing-password':'Enter your password.','auth/operation-not-allowed':'Email sign-in is not enabled in Firebase yet.'})[e.code]||e.message};
 $('#si').onclick=()=>signInWithEmailAndPassword(auth,em(),pw()).catch(fail);

 $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#si').click()};
 window.app={out:()=>signOut(auth)};
 onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];
  if(!u){$('#gate').hidden=false;$('.gatebg').hidden=false;$('#app').hidden=true;return}

  COLS.forEach(c=>unsubs.push(onSnapshot(ref(c),snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));ready[c]=1;autoBill();migrate();dropTax();fixCats();render()})));
 });
}

/* ---------- recurring invoice automation ---------- */
let billing=false;
async function autoBill(){
 if(billing||!ready.clients||!ready.invoices)return;billing=true;
 for(const c of S.clients){
  if(c.active===false||!c.nextDue)continue;let d=c.nextDue,changed=false;
  while(diff(d)<=BILL_AHEAD_DAYS){
   const id=`${c.id}_${d}`;
   if(!S.invoices.some(i=>i.id===id))await setDoc(dref('invoices',id),{clientId:c.id,clientName:c.name,amount:(+c.amount||0),due:d,status:'pending',frequency:c.frequency});
   d=addMonths(d,STEP[c.frequency]||1);changed=true;
  }
  if(changed)await upd('clients',c.id,{nextDue:d});
 }
 billing=false;
}

const OWNERS=()=>[...new Set(['Twocan','Lone Tree Villas','Sarah',...S.clients.map(c=>c.name)])];
let migrated=false;
let taxDone=false;
function dropTax(){if(taxDone||!ready.buckets)return;taxDone=true;const t=S.buckets.find(b=>b.name==='Tax & buffer'),sv=S.buckets.find(b=>b.name==='Savings & Goals');if(!t)return;if(sv)upd('buckets',sv.id,{pct:+sv.pct+ +t.pct});del('buckets',t.id)}
let catsDone=false;
function fixCats(){if(catsDone||!ready.buckets)return;catsDone=true;[['Free spending',['Eating out','Subscriptions','Personal care']],['Giving',['Family support']]].forEach(([n,cs])=>{const b=S.buckets.find(x=>x.name===n);if(b){const m=cs.filter(c=>!(b.cats||[]).includes(c));if(m.length)upd('buckets',b.id,{cats:[...(b.cats||[]),...m]})}})}
function migrate(){if(migrated||!COLS.every(c=>ready[c]))return;migrated=true;const c=S.clients.find(x=>x.name==='LTV'),N='Lone Tree Villas';if(!c)return;
 upd('clients',c.id,{name:N});S.tasks.filter(t=>t.client==='LTV').forEach(t=>upd('tasks',t.id,{client:N}));S.daily.filter(t=>t.client==='LTV').forEach(t=>upd('daily',t.id,{client:N}));S.billing.filter(t=>t.owner==='LTV').forEach(t=>upd('billing',t.id,{owner:N}));S.invoices.filter(i=>i.clientName==='LTV').forEach(i=>upd('invoices',i.id,{clientName:N}))}
/* ---------- urgency engine ---------- */
function items(){
 const t=S.tasks.filter(x=>!x.done).map(x=>({kind:'task',id:x.id,title:x.title,due:x.due,cat:x.client||x.category,p:x.priority,remind:+x.remind||1}));
 const i=S.invoices.filter(x=>x.status!=='paid').map(x=>({kind:'invoice',id:x.id,title:`${x.clientName} invoice`,due:x.due,p:'Mid',remind:3,sent:x.status==='sent'}));
 const bl=S.billing.filter(b=>b.lastInvoiced).map(b=>({kind:'bill',id:b.id,title:`${b.name} · for ${b.owner}`,due:billNext(b),p:'Mid',remind:2}));return[...t,...i,...bl].map(x=>{const n=diff(x.due);x.days=n;
  x.lvl=n<0||x.p==='Urgent'||(x.kind!=='task'&&n<=3)||n<=1?'urgent':(x.p==='Mid'||n<=7||(x.kind!=='task'&&n<=10))?'mid':'low';return x}).sort((a,b)=>a.days-b.days);
}

  spend:'Winn SPEND%0AAmount: %0AWhat: %0ACategory: Food%0AAccount: M-Pesa',
  plan:'Winn PLAN%0ABlock: %0ADate: '+TODAY+'%0AStart: 09:00%0AEnd: 11:00%0AType: Deep work'
 };const t=lines[kind]||lines.task;window.open('https://wa.me/?text='+t,'_blank')}
});
/* ---------- WhatsApp (outbound alerts via CallMeBot; app must be open or tab awake) ---------- */
const waCfg=()=>({phone:'',apikey:'',on:false,...(S.settings.find(x=>x.id==='whatsapp')||{})});
function waMessage(due){
 const lines=due.slice(0,8).map(x=>`• ${x.days<0?'⚠️ OVERDUE':x.days===0?'📌 Today':`In ${x.days}d`}: ${x.title}`);
 return `*Winn reminder* (${TODAY})\n${due.length} item${due.length>1?'s':''} need attention:\n${lines.join('\n')}\n\nOpen Winn to mark Done / Paid.`;
}
async function sendWhatsApp(text){
 const c=waCfg();if(!c.phone||!c.apikey)return{ok:false,err:'Set phone and API key first'};
 const url='https://api.callmebot.com/whatsapp.php?phone='+encodeURIComponent(c.phone)+'&text='+encodeURIComponent(text)+'&apikey='+encodeURIComponent(c.apikey);
 try{
  // no-cors: browser cannot read body, but the request is sent
  await fetch(url,{mode:'no-cors',cache:'no-store'});
  // also fire via Image as a second path some networks allow
  const img=new Image();img.src=url+'&_='+Date.now();
  return{ok:true};
 }catch(e){return{ok:false,err:e.message||String(e)}}
}
/* Reminders: browser + WhatsApp when due. Fire while the app tab is open. */
function remind(force){
 const due=items().filter(x=>x.days<=x.remind);
 if(!due.length)return;
 const k='reminded-'+TODAY+'-'+due.map(x=>x.id).sort().join(',').slice(0,80);
 if(localStorage.getItem(k)&&!force)return;
 if('Notification'in window&&Notification.permission==='granted'){
  new Notification(`${due.length} item${due.length>1?'s':''} need attention`,{body:due.slice(0,6).map(x=>`${x.days<0?'OVERDUE':x.days==0?'Today':'In '+x.days+'d'}: ${x.title}`).join('\n')});
 }
 const c=waCfg();
 if(c.on&&c.phone&&c.apikey)sendWhatsApp(waMessage(due));
 localStorage.setItem(k,1);
}
setInterval(()=>ready.tasks&&remind(),10*60*1000);
setTimeout(()=>{if(ready.tasks&&ready.invoices)remind()},2500);
</script>
